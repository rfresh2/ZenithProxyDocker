name: Publish ZenithProxy Docker Image to Github Packages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [launcher-release]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set Alpine Container Tag Var
        run: |
          echo "ALPINE_CONTAINER_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/zenithproxy:latest-alpine" >> $GITHUB_ENV

      - name: Set Container Tag Var
        run: |
          echo "CONTAINER_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/zenithproxy:latest" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push alpine image
        uses: docker/build-push-action@v7
        with:
          file: ./alpine.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.ALPINE_CONTAINER_TAG }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CONTAINER_TAG }}
